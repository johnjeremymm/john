<!doctype html>
<html lang="en">
  <head>
    <!-- SITE SETUP (para sa bagong tao): palitan ang mga ito sa taas ng file na ito dahil hindi ito mababago ng JavaScript.
         1. <title> at meta description
         2. og:title, og:description, og:url, og:image, og:image:alt, twitter:image, canonical (domain ng bagong site)
         3. <link rel="preload"> ng pfp (kung iba ang filename ng photo)
         Ang lahat ng iba pa (pangalan, links, numero, footer) ay nasa config.js. -->
    <meta charset="utf-8" />
    <!-- VIEWPORT: ginagawang tama ang laki ng page sa phone. viewport-fit=cover = sakop pati notch area. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" id="mtc" content="#0A0F1C" />
    <!-- color-scheme: dark o light ayon sa napiling mode (ina-update ng script sa ibaba at ng switch sa page) -->
    <meta name="color-scheme" id="mcs" content="dark" />
    <!-- SEO + SHARE PREVIEW: lumalabas kapag ishinare ang link (Messenger, IG, iMessage, etc.). Para lumabas ang picture, ilagay ang buong URL ng site mo sa og:image (hal. https://yoursite.com/pfp.png). -->
    <meta
      name="description"
      content="Contact John Jeremy: social links, call, save contact, or send a message."
    />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Let’s Connect | John Jeremy" />
    <meta
      property="og:description"
      content="Tap to call, save my contact, or send me a message."
    />
    <!-- og:url at og:image: buong URL ng site (Vercel). Kapag nagpalit ng domain, palitan ang tatlong URL dito at ang canonical sa ibaba. -->
    <meta
      property="og:url"
      content="https://linkertap.vercel.app/@john/"
    />
    <meta property="og:site_name" content="Linkertap" />
    <meta
      property="og:image"
      content="https://linkertap.vercel.app/@john/pfp.jpg"
    />
    <meta property="og:image:alt" content="John Jeremy" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:image"
      content="https://linkertap.vercel.app/@john/pfp.jpg"
    />
    <link rel="canonical" href="https://linkertap.vercel.app/@john/" />
    <!-- FAVICON: emoji muna habang wala pang icon file. Palitan ng <link rel="icon" href="favicon.png"> kung meron. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B2%3C/text%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- iOS: pinipigilan ang auto-detect ng numero (para hindi lumabas ang sarili nilang "Call / Add to Contacts" sa text). Gumagana pa rin ang mga tel: link na ikaw ang naglagay. -->
    <meta name="format-detection" content="telephone=no" />
    <!-- iOS: para sa "Add to Home Screen" mode (fullscreen, walang browser bar) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      id="msb"
      content="black-translucent"
    />
    <!-- TITLE: ito ang makikita sa browser tab. -->
    <title>Let’s Connect | John Jeremy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- FONT: Plus Jakarta Sans mula sa Google Fonts. Kailangan ng internet para ma-load. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- DESIGN: lahat ng kulay, laki at layout ay nasa style.css -->
    <link rel="stylesheet" href="style.css" />
    <!-- THEME + MODE: config.js ay nilo-load dito (sa head) para tama na agad ang kulay bago lumabas ang page, walang flash.
         Kulay (theme) = galing sa config.js -> theme (o ?theme=gold sa URL para sa preview).
         Dark / Light = pinipili ng bisita gamit ang switch sa page. Unang bukas: sumusunod sa setting ng phone niya;
         pagkatapos, naaalala ang pinili niya (localStorage). Pang-preview lang ang ?mode=light sa URL, hindi ito sine-save. -->
    <script src="config.js"></script>
    <script>
      (function () {
        var T = [
          "navy",
          "gold",
          "emerald",
          "violet",
          "rose",
          "teal",
          "ember",
          "slate",
        ];
        var KEY = "lc-mode";
        var q = new URLSearchParams(location.search);
        var t = q.get("theme") || CONFIG.theme || "navy";
        if (T.indexOf(t) < 0) t = "navy";
        var r = document.documentElement;
        var mq = window.matchMedia
          ? matchMedia("(prefers-color-scheme: light)")
          : null;
        var get = function () {
          try {
            var v = localStorage.getItem(KEY);
            return v === "light" || v === "dark" ? v : null;
          } catch (e) {
            return null;
          }
        };
        var set = function (id, v) {
          var el = document.getElementById(id);
          if (el) el.setAttribute("content", v);
        };
        function paint(light) {
          r.setAttribute("data-theme", t);
          r.setAttribute("data-mode", light ? "light" : "dark");
          r.style.colorScheme = light ? "light" : "dark";
          set(
            "mtc",
            getComputedStyle(r).getPropertyValue("--bg2").trim() || "#0A0F1C",
          );
          set("mcs", light ? "light" : "dark");
          set("msb", light ? "default" : "black-translucent");
          document.dispatchEvent(new Event("modechange"));
        }
        // ginagamit ng switch sa page (script.js). keep = i-save ang pinili ng bisita.
        window.setMode = function (light, keep) {
          paint(light);
          if (keep) {
            try {
              localStorage.setItem(KEY, light ? "light" : "dark");
            } catch (e) {}
          }
        };
        var pm = q.get("mode");
        var m =
          pm === "light" || pm === "dark"
            ? pm
            : get() || (mq && mq.matches ? "light" : "dark");
        paint(m === "light");
        // wala pang pinili ang bisita: sumunod sa pagbabago ng setting ng phone niya
        if (!pm && mq && mq.addEventListener)
          mq.addEventListener("change", function (e) {
            if (!get()) paint(e.matches);
          });
      })();
    </script>
    <!-- PRELOAD: sinisimulan nang i-download ang pfp habang nagbabasa pa ng CSS/JS. Kung papalitan mo ang photo sa config.js, palitan din ito. -->
    <link rel="preload" as="image" href="pfp.jpg" fetchpriority="high" />
    <!-- Kapag naka-off ang JavaScript, nakatago ang lahat (opacity 0). Ibinabalik ito ng noscript. -->
    <noscript
      ><style>
        .in,
        .pop,
        .line {
          opacity: 1;
        }
      </style></noscript
    >
    <!-- FAILSAFE: kung may error sa script at hindi tumakbo ang intro, ipinapakita pa rin ang page pagkalipas ng 3.5s -->
    <script>
      setTimeout(function () {
        document.documentElement.classList.add("failsafe");
      }, 3500);
    </script>
  </head>
  <body>
    <!-- TOP BAR: share profile (kaliwa) + dark / light switch (kanan). Naka-pwesto sa itaas ng screen at HINDI nawawala kahit nagta-type.
         Share = bubukas ang share sheet (may QR code) at ang built-in share options ng device (script.js section 17).
         Dark / light = araw (light) <-> buwan (dark). Ang logic ay nasa script.js (section 3b). -->
    <div class="tbar" id="tbar">
      <button
        class="tshare"
        id="tshare"
        type="button"
        aria-label="Share profile"
        title="Share profile"
        aria-haspopup="dialog"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 15V3M7.5 7.5 12 3l4.5 4.5" />
          <path d="M5 12.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.5" />
        </svg>
      </button>
      <button
        class="tmode"
        id="tmode"
        type="button"
        aria-label="Switch to light mode"
        title="Switch theme"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <mask
            id="tmm"
            maskUnits="userSpaceOnUse"
            x="-6"
            y="-6"
            width="36"
            height="36"
          >
            <rect x="-6" y="-6" width="36" height="36" fill="#fff" />
            <circle class="tm-cut" cx="17.5" cy="6.5" r="7.2" fill="#000" />
          </mask>
          <g mask="url(#tmm)">
            <circle class="tm-core" cx="12" cy="12" r="5" fill="currentColor" />
          </g>
          <path
            class="tm-rays"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"
          />
        </svg>
      </button>
    </div>
    <!-- ==== MAIN PAGE ====
         Ang .stage ay may 3 bahagi: (1) header (pfp, title, name), (2) social buttons, (3) Send a Message card.
         Sa landscape, lilipat ang (2) at (3) sa kanan. Ang .sp ay spacer (m = laki ng gap). -->

      <!-- HEADER: pfp + LET'S CONNECT + name -->
      <div class="hd">
        <div class="hdi">
          <i class="sp" style="--m: 84; --g: 0.6"></i>
          <!-- PROFILE PHOTO: palitan sa config.js -> photo. Ang placeholder sa loob ay para lang kung walang photo. -->
          <div
            class="avatar pop"
            id="av"
            style="--d: 0.05s"
            role="button"
            tabindex="0"
            aria-label="View profile photo"
          >
            <div class="avg">
              <div class="in2" id="photo">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                  <rect width="100" height="100" fill="#E8ECF4" />
                  <circle cx="50" cy="38" r="18" fill="#9AA6BD" />
                  <path
                    d="M14 100c0-24 15-36 36-36s36 12 36 36z"
                    fill="#9AA6BD"
                  />
                </svg>
              </div>
            </div>
            <!-- SOUNDWAVE BADGE: dating "active" dot. Real-time na audio visualizer (script.js section 17). Pwesto at laki = kapareho ng dating dot. -->

              <canvas id="wvc"></canvas>
            </div>
          </div>
          <i class="sp" style="--m: 64; --g: 0.5"></i>

          </div>
          <i class="sp" style="--m: 46; --g: 0.2"></i>
          <!-- NAME: galing sa config.js -> name (nasa gitna ng dalawang guhit) -->
          <div class="nrow">
            <div class="rule sh line" style="--d: 0.45s"></div>
            <div class="nm in" id="nm" style="--d: 0.4s"></div>
            <div class="rule sh r line" style="--d: 0.45s"></div>
          </div>
          <!-- BIO: galing sa config.js -> role, location, bio. Dalawang chip (role + location) sa itaas at ang bio na pangungusap sa ilalim.

                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"

                    />

            <!-- INSTAGRAM + TIKTOK (magkatabi) -->
            <div class="row2">
              <!-- INSTAGRAM (link: CONFIG.instagram) -->
              <div class="in" style="--d: 0.75s">

                  href="#"

                  style="--tg: 30"

                  <svg
                    class="ic"
                    style="border-radius: 0"

                    />

          </svg>
          <div class="ct">Send a Message</div>
          <div class="pill" id="pill">
            <span class="pt" id="pt">Email</span>
          </div>
        </div>
        <!-- Textbox ng message. Ang expand icon (id="open") ay nagpapalaki nito habang nagta-type. -->
        <div class="box">
          <textarea
            id="msg"
            placeholder="Your Message…"
            aria-label="Your message"
            enterkeyhint="done"
            autocomplete="off"
            maxlength="800"
          ></textarea>
          <button
            class="x"
            id="open"
            type="button"
            aria-label="Expand message form"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
            </svg>
          </button>
        </div>
        <!-- Baba ng card: switch button (Email <-> Phone) + Send button -->
        <div class="cf">
          <button
            class="sw"
            id="sw"
            type="button"
            aria-label="Switch contact type"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m17 3 4 4-4 4M21 7H7M7 21l-4-4 4-4M3 17h14" />
            </svg>
          </button>
          <div class="small" id="swl">Switch to SMS</div>
          <button class="send" id="send" type="button">
            <svg
              id="sico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#fff"
              stroke-width="1.6"
              stroke-linejoin="round"
              stroke-linecap="round"
            >
              <rect x="2.5" y="5" width="19" height="14" rx="1.5" />
              <path d="m2.5 6 9.5 7.5L21.5 6M2.5 18.5l7-7M21.5 18.5l-7-7" />
            </svg>
            <span id="sendt">Send now</span>
          </button>
        </div>
      </section>
      <i class="sp t0" style="--m: 90; --g: 0.8"></i>
      <!-- FOOTER: palitan ang © text sa loob ng span -->
      <div class="foot">
        <div class="rule line" style="--d: 1.3s"></div>
        <span class="in" id="footer" style="--d: 1.25s"></span>
        <div class="rule r line" style="--d: 1.3s"></div>
      </div>
      <i class="sp t1" style="--m: 30; --g: 0.5"></i>
    </main>
    <!-- CALL POPUP: ang laman ng mga numero ay binubuo ng script.js mula sa CONFIG.phones -->
    <div
      class="ov"
      id="callov"
      role="dialog"
      aria-modal="true"
      aria-label="Choose a number"
    >
      <div class="cbg" id="cbg"></div>
      <!-- GLOW: hiwalay na layer sa likod ng sheet; pwesto ay galing sa script.js -->
      <div class="sglow" id="sglow"></div>
      <div class="sheet" id="csheet">
        <div class="eb">
          <i class="rule"></i>
          <span>SELECT NUMBER</span>
          <i class="rule r"></i>
        </div>
        <h2 id="callname"></h2>
        <p>Choose a number to open it in your phone app.</p>
        <a class="opt" id="n1"></a>
        <a class="opt" id="n2"></a>
        <button class="cancel" type="button" data-close>Cancel</button>
      </div>
    </div>
    <!-- PHOTO VIEWER + MUSIC PLAYER: popup na malaking pfp pag pinindot ang profile photo.
         Sa ilalim ng pfp: pamagat ng kanta, kumanta, at ang soundwave (lumipat dito mula sa maliit na badge sa pfp).
         Walang play / stop / next / back: kusang tumutugtog at paulit-ulit (loop). Ang progress bar ay pang-display lang. -->
    <div
      class="pv"
      id="pv"
      role="dialog"
      aria-modal="true"
      aria-label="Profile photo and now playing"
    >
      <div class="pvbg" id="pvbg"></div>
      <div class="pvbox" id="pvbox">
        <div class="pvm" id="pvm"><div class="pvi" id="pvi"></div></div>
        <div class="pvdot" id="pvdot"><canvas id="pvdc"></canvas></div>
      </div>
      <div class="pvcap" id="pvcap">
        <b id="pvtitle" style="--i: 0"></b>
        <em id="pvartist" style="--i: 1"></em>
        <canvas class="pvwave" id="pvwave" style="--i: 2"></canvas>
        <button
          class="pvmute"
          id="pvmute"
          type="button"
          aria-pressed="false"
          aria-label="Mute music"
          style="--i: 3"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" />
            <path class="pm-w1" pathLength="1" d="M15.5 9a4.5 4.5 0 0 1 0 6" />
            <path class="pm-w2" pathLength="1" d="M18.2 6.4a8 8 0 0 1 0 11.2" />
            <path class="pm-x1" pathLength="1" d="M16 9.5l5 5" />
            <path class="pm-x2" pathLength="1" d="M21 9.5l-5 5" />
          </svg>
          <span id="pvmutet">Mute</span>
        </button>
        <small style="--i: 4">Tap anywhere to close</small>
      </div>
    </div>
    <!-- SHARE SHEET: QR code + share link. Kusa ring bubukas ang built-in share options ng device kapag pinindot ang share icon. -->
    <div
      class="ov"
      id="shareov"
      role="dialog"
      aria-modal="true"
      aria-label="Share profile"
    >
      <div class="cbg" id="sbg"></div>
      <div class="sheet shsheet" id="shsheet">
        <div class="eb">
          <i class="rule"></i>
          <span>SHARE PROFILE</span>
          <i class="rule r"></i>
        </div>
        <h2 id="shname"></h2>
        <p>Scan the QR code, or share my link.</p>
        <div
          class="qrw"
          id="qrw"
          aria-label="QR code of my profile link"
          role="img"
        ></div>
        <button class="shbtn" id="shnative" type="button">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 15V3M7.5 7.5 12 3l4.5 4.5" />
            <path d="M5 12.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.5" />
          </svg>
          <span id="shnativet">Share link</span>
        </button>
        <button class="shbtn alt" id="shcopy" type="button">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="9" y="9" width="11" height="11" rx="2.5" />
            <path d="M5 15V6a2 2 0 0 1 2-2h9" />
          </svg>
          <span>Copy link</span>
        </button>
        <button class="cancel" type="button" data-close>Close</button>
      </div>
    </div>
    <!-- BACKGROUND MUSIC: ang file ay galing sa config.js -> audio. Kusang tumutugtog pag-load (loop), walang controls. -->
    <audio id="bgm" loop preload="auto" playsinline></audio>
    <!-- TOAST: maliit na notification (hal. "Message sent") -->
    <div class="toast" id="toast" role="status"></div>
    <!-- LOGIC (ang config.js ay nasa head na): lahat ng gumagalaw (send, popup, animation) ay nasa script.js. Dapat nasa dulo ng body. -->
    <script src="script.js"></script>
  </body>
</html>
